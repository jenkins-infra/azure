name: Update outbound IPs from Azure Network report

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"

sources:
  getInfraCiAgentsOutboundIps:
    kind: json
    spec:
      file: https://reports.jenkins.io/jenkins-infra-data-reports/azure-net.json
      key: .infra\.ci\.jenkins\.io.outbound_ips
    transformers:
      - trimprefix: "["
      - trimsuffix: "]"
      - replacer:
          from: " "
          to: "\",\n      \""
      - addprefix: "[\n      \""
      - addsuffix: "\",\n    ]"

targets:
  updateSwedenCentralCache:
    name: Update Sweden Central storage account network IPs
    kind: hcl
    sourceid: getInfraCiAgentsOutboundIps
    scmid: default
    spec:
      file: caches.tf
      path: resource.azurerm_storage_account.cache_sweden_central.network_rules.ip_rules

actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: Update infra.ci.jenkins.io agents outbound IPs in Sweden Central cache
    spec:
      labels:
        - dependencies
        - infra-ci-agents-outbound-ips
        - sweden-central-cache
